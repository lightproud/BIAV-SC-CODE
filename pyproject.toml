# 银芯 Python 侧工程配置（结构审视 T72，守密人 2026-07-27 裁定「做」）。
#
# ## 这个文件解决什么
#
# 本仓 Python 侧长期不是包：模块以裸 basename 互相 import，路径靠每个档自己往
# `sys.path` 里塞——审视实测 164 处。真正的代价不是那些行本身，而是**路径知识
# 散落在 164 个地方**：迁一次目录就得挨个追，追漏了不会有任何静态检查报警，只在
# 运行时炸 ImportError；2026-07-27 的 P3 迁档就漏了 8 处，而且全量测试照常报绿
# （pytest 单进程共享 sys.path，先收集的档替后面的铺了路）。
#
# ## 为什么不做「真」包化
#
# 「真」包化要把脚本改成 `python -m` 运行。实测本仓 CI 有 28 处、MCP 服务端 1 处
# 全部是 `python <路径>.py` 形态，零处用 `-m`；改运行方式会同时打断 CI、MCP 配置
# 和守密人的手动用法，收益却只是形式上「像个包」。审视给 T72 的判词是「危害已消，
# 剩余是形式」——所以这里做的是**把散落的路径知识收敛成真相源**，而不是为了名分
# 去动运行形态。
#
# ## 收敛后的三处真相源（全仓再无第四处知道这些目录在哪）
#
#   1. 本文件 `[tool.pytest.ini_options] pythonpath` —— pytest 场景（pytest 7+
#      原生机制，取代 conftest.py 里的手工注入）
#   2. `tests/_paths.py` —— `python tests/test_x.py` 直跑场景（conftest 与本文件
#      都不参与那条路径；70 个测试档带 `__main__` 入口，这个能力不牺牲）
#   3. `scripts/news_bridge.py` —— 顶层脚本层取采集层 SSOT（结构审视 P4）
#
# 守卫：`tests/test_test_isolation.py` 钉死「不得再出现第四处手写路径」。

[project]
name = "biav-sc"
version = "0.0.0"
description = "银芯（BIAV-SC）Python 侧工程配置——不发布，仅用于收敛工具链配置"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# pytest 原生的路径注入（7.0+）。这一行取代了 conftest.py 里的手工 sys.path 拼装，
# 也让测试档不必再各自抄一遍「三个源目录在哪」。
pythonpath = [
    ".",                        # `from projects.news.scripts.x import` 的包路径形态（mutmut twin 用）
    "scripts",
    "projects/news/scripts",
    "projects/wiki/scripts",
]
testpaths = ["tests"]

# ─────────────────────────────────────────────────────────────────────────────
# ruff —— Python 侧静态门禁（棘轮式，2026-07-28 全仓缺陷扫描后立）
#
# ## 为什么现在才立，以及为什么必须立
#
# 本仓 Python 侧此前**没有任何 lint 门禁**。2026-07-28 的全仓扫描一次性清出
# 488 项静态可测缺陷（未用 import 106、句柄泄漏 34、zip 静默截断 14、歧义变量名 22、
# 空串 env 在 import 期打死采集器 8 处……），但**清完之后没有任何机制阻止它们重新长
# 回来**——下一个会话照样可以写出同样的 `json.load(open(...))`。一次性清扫是止血，
# 门禁才是缝合。
#
# ## 为什么是棘轮而不是「全开」
#
# 全开会立刻红 19724 条，其中绝大多数是**本仓刻意的选择**而非缺陷：中文标点被判
# 「歧义 unicode」（RUF001/2/3 共 9585 条）、测试里的 assert（S101 2240）、CLI 脚本的
# print（T201 544）。把这些逼成红灯，结果只会是整条门禁被关掉——这正是 lint 门禁最
# 常见的死法。
#
# 故取本仓既有的**棘轮**范式（同 `mutation-ratchet.json` / `conformance-drift`）：
#   * `select` 取**整族**——新增规则自动进入射程，这是门禁能抓到**新缺陷类**的前提；
#   * `ignore` 逐条列出**当前仍有欠账**的规则，每条注明为何欠着；
#   * **收紧的方式是从 ignore 里删一条**，删完那条即永久不得复发。
# 已经清零的 619 条规则因此全部在保护之下：任一条重新出现即红。
#
# ## 版本钉死
#
# `scripts/requirements.txt` 钉死 ruff 版本。不钉的话，ruff 一升级新增几条规则，
# 门禁会在**与本次改动无关**的 PR 上突然变红——那种红灯教会人的是「lint 不可信」。
# 升级 ruff 是一次**刻意**的动作：升版本 + 该修的修 / 该进 ignore 的进 ignore。
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 120          # 仅供 formatter 参考；E501 在 ignore 里（见下）
extend-exclude = ["node_modules", "dist", "Public-Info-Pool/Reference"]

[tool.ruff.lint]
# 整族选入：新规则自动进射程（见上「为什么是棘轮」）
select = [
    "F", "E", "W",              # pyflakes + pycodestyle
    "B", "C4", "SIM", "RUF",    # bugbear / comprehensions / simplify / ruff 自有
    "PIE", "PERF", "RET", "PTH", "DTZ",
    "S", "BLE", "LOG", "G", "ISC", "TID",
    "PL", "TRY", "FLY", "UP", "ARG", "T20", "ERA", "ICN", "NPY",
    "A", "PT", "RSE", "SLF", "PYI", "FURB", "PGH", "YTT",
    "ASYNC", "C90", "EXE", "FA", "INT", "SLOT", "TC", "INP",
]

ignore = [
    # ── 甲、语言与体裁使然，不是缺陷（永久豁免，不打算收紧）────────────────
    "RUF001", "RUF002", "RUF003",  # 9640  中文全角标点被判「歧义 unicode」
    "PLC2401",                     #   11  非 ASCII 标识符——本仓刻意允许中文常量名
    "S101",                        # 2240  测试里的 assert 就是测试的写法
    "T201",                        #  544  CLI 脚本的 print 是它的输出面，不是调试残留
    "G004",                        #  246  日志用 f-string 是全仓既有风格
    "E501",                        #  108  行长：中文档案按语义断行，字符数不是好尺子
    "TRY003",                      #   74  异常写长消息是刻意的（错因要能直接读懂）
    "ERA001",                      #   11  「注释掉的代码」对中文说明误判率高
    "EXE001",                      #   61  shebang 与可执行位：脚本一律经 `python3 x.py` 调用

    # ── 乙、结构性选择，不是欠账（永久豁免；理由都在本档开头那段说明里）──────
    # 这几条 2026-07-28 首版曾误列进「打算收紧」栏。它们不是拖着没做，而是本仓
    # **明确选过的形态**——挂在欠账栏里会让后来人以为总有一天要还，白耗判断力。
    "PLC0415",  #  323  函数内 import：本仓「可选依赖缺失即优雅降级」的实现方式
    "INP001",   #  163  隐式命名空间包：Python 侧刻意不是包（本档开头已详述取舍）
    "E402",     #   53  sys.path 引导后再 import，是上一条的直接后果
    "S603",     #   30  subprocess 调用——全部为本仓自控命令行，无外部输入拼接
    "S607",     #   29  同上：相对路径调 git / gh，CI 与本地 PATH 均受控

    # ── 丙、当前欠账，**打算收紧**（删一条即棘轮一格）──────────────────────
    # 数字为 2026-07-28 二类欠账推进后的实测量，便于下次判断先啃哪条。
    "PT009",    # 1857  unittest 断言风格 → pytest 断言：独立迁移工程，非 lint 射程
    "RUF100",   #  149  失效 noqa：多为非 ruff 的 WPS 码，清理需先定其他 linter 去留
    "BLE001",   #  143  宽捕获：已收窄 22 处，余下逐条甄别（teardown 路径就该宽）
    "PLR2004",  #  130  魔数比较
    "PT018",    #   85  复合断言拆分
    "SIM117",   #   44  嵌套 with
    "PERF401",  #   43  手写循环建列表
    "RUF059",   #   30  未用解包变量
    "PLW1510",  #   26  subprocess 不带 check（已核实真丢弃返回码者仅 1 处并修掉）
    "PT027",    #   20  unittest 风格的 assertRaises
    "TRY300",   #   18  return 挪进 else
    "PLW2901",  #   18  循环变量覆写——逐个看过，全是 `line = line.strip()` 惯用法
    "SLF001",   #   16  访问私有成员（tests/ 已在 per-file-ignores 里另行豁免）
    "S310",     #   16  urlopen：SSRF 守卫在 news_common，非裸调用
    "S110",     #   13  静默吞异常：可收窄者已收窄，余为刻意 best-effort
    "S108",     #   10  硬编码临时路径（多在测试夹具）
    "PLW0603",  #    9  global 语句
    "DTZ007",   #    7  朴素 strptime：余下均为纯日期差计算，无时区语义
    "ARG001",   #    7  未用函数参数（接口一致性所需）
    "SIM105",   #    6  try/except/pass → contextlib.suppress
    # os.path → pathlib 迁移（合计 214），是一件独立工程，按目录分批更稳：
    "PTH123", "PTH118", "PTH122", "PTH112", "PTH208", "PTH105", "PTH207", "PTH103",
]

# ── 复杂度：阈值化而非忽略（2026-07-28 二类欠账推进）────────────────────────
# C901 / PLR0911-0915 原先整条进 ignore ——「忽略」意味着一个 80 分支的新函数照样
# 进得来，门禁一句话不说。改为**把阈值钉在当前上界**：现状全部合规（故门禁绿），
# 但任何**更差**的写法立刻红。这是棘轮而不是宽恕——数字只许往下调，不许往上抬。
#
# 上界系实测（逐值下探至刚好为零），2026-07-28 当日值：
#   分支 39（`generate_wiki_pages.generate_story`）· 语句 134 · 圈复杂度 50
#   参数 16 · return 23
# 收紧路径：拆掉最大的那个函数后，把对应数字下调一格。
[tool.ruff.lint.mccabe]
max-complexity = 50

[tool.ruff.lint.pylint]
max-branches = 39
max-statements = 134
max-args = 16
max-returns = 23

[tool.ruff.lint.per-file-ignores]
# 测试档允许更多自由度（夹具、桩、白盒断言）
"tests/**" = ["S105", "S106", "S107", "SLF001", "ARG", "PLR2004"]
