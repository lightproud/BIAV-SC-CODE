name: Secret Scan

# 显式凭据扫描（gitleaks）——补强「银芯自有凭据面」的供应链/泄漏防线。
# 落地依据：守密人 2026-07-19 裁定（KIMI3 静态审查 B 段「加 secret 扫描」直接落地）。
# 与既有 redact_secrets（落盘/日志脱敏）互补：那条防「写出去」，本条防「提交进来」。
# 扫描范围经 .gitleaks.toml 聚焦代码/CI/脚本/配置，社区全量档案层 allowlist 排除避免误报。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:17 UTC（≈ 北京时间 11:17）全量兜底扫一遍历史，抓 PR/push 增量漏网。
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # PR 扫描要列 PR commit 范围（GET /pulls/{n}/commits）；仍不给 write，
  # 评论已由 GITLEAKS_ENABLE_COMMENTS: false 关闭，最小权限不变。
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（全历史，gitleaks 需 commit 范围）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # gitleaks-action v2 扫 pull_request 事件强制要求 GITHUB_TOKEN（用于取 PR
          # commit 范围）。缺此项时 action 在扫描启动前即 ##[error] 退出——2026-07-19
          # 本工作流落地起 pull_request 事件 30/30 全红，凭据扫描从未在任何 PR 上
          # 真正跑过（push / schedule 事件不走该分支，一直有效）。补于 2026-07-25。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 个人账户 / 公开仓无需 GITLEAKS_LICENSE。
          # 关闭 PR 评论以维持 contents: read 最小权限（发现即 job 失败，已足够作门）。
          GITLEAKS_ENABLE_COMMENTS: false
          # 步骤摘要关闭（守密人 2026-07-20 裁定）：全历史扫命中过多时摘要体超
          # GitHub 1MB 上限反把 job 炸红（2026-07-20 实测 5MB）；报告一律走
          # SARIF 工件（gitleaks-results.sarif.zip，action 自动上传），不走摘要。
          GITLEAKS_ENABLE_SUMMARY: false
