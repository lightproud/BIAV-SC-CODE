name: SDK Mutation Ratchet (weekly)

# Test-QUALITY ratchet for silver-core-sdk (keeper order 2026-07-13): the
# 2026-07-13 quality campaign pushed per-module mutation scores up
# (permissions 92.87%, transport/openai 85.55%); this workflow re-measures
# each ratcheted target weekly and REDS when a score falls below its
# committed floor (mutation-ratchet.json) - i.e. new code brought mutants
# the suite does not kill. Floors only rise (bump after a measured
# improvement); lowering one requires a keeper ruling. Complements the
# python-side mutation-test.yml (mutmut, scripts/) and the SDK unit suite:
# line coverage proves a line ran, the ratchet proves the assertions BITE.
#
# Deliberately scheduled + manual, NOT a per-PR required check: a full
# per-target Stryker round costs ~7-12 minutes.
#
# Matrix legs are GENERATED from the two mutation-ratchet.json files by the
# `targets` job below (keeper ruling 2026-07-26, drift-resistant-architecture
# proposal move 1: generate instead of cross-check). Adding a ratchet target
# means editing ONE file - the baseline - and the matrix follows. The earlier
# arrangement kept the same list in two hand-written places, which is how the
# loop-support floor sat unmeasured from 2026-07-17 to 2026-07-26: it was in
# the baseline, absent from the matrix, and the guard script only reds the
# other direction (a matrix leg with no floor).
# tests/test_mutation_ratchet_matrix.py stays on as a second belt.

# MANUAL-ONLY since 2026-08-02 (keeper ruling: engineering-gate demolition;
# family in pure-maintenance mode, todo T78). Cron removed — dispatch by hand.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Single ratchet target name to run (empty = full matrix)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # The single source of truth for "what gets ratcheted" is the baseline file
  # of each package. This job just reads them out; nothing here decides
  # anything. Sparse to the two baselines - no checkout of the repo body.
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.read.outputs.agent }}
      maestro: ${{ steps.read.outputs.maestro }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /projects/silver-core-sdk/mutation-ratchet.json
            /projects/silver-core-maestro-sdk/mutation-ratchet.json
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          set -euo pipefail
          # Cadence gate (keeper ruling 2026-07-26, product review P2). A target
          # may carry "cadence": "monthly"; absent means weekly. Monthly targets
          # guard module families with zero real call sites — they keep their
          # floors and tests, they just do not need re-measuring every week.
          #
          # Monthly rounds fire on the FIRST scheduled Monday of the month
          # (the cron is Mondays, so day-of-month <= 7 is that Monday). ANY
          # manual dispatch runs the full set: when a human comes looking, they
          # get everything.
          INCLUDE_MONTHLY=0
          if [ "${{ github.event_name }}" != "schedule" ]; then
            INCLUDE_MONTHLY=1
          elif [ "$(date -u +%d)" -le 07 ]; then
            INCLUDE_MONTHLY=1
          fi
          echo "include_monthly=$INCLUDE_MONTHLY (event=${{ github.event_name }}, day=$(date -u +%d))"
          emit() {
            local file="$1" key="$2"
            local list skipped
            list=$(INCLUDE_MONTHLY="$INCLUDE_MONTHLY" node -e "
              const b = require('./$file');
              const all = b.targets ?? [];
              if (all.length === 0) { console.error('no targets in $file'); process.exit(2); }
              const monthly = process.env.INCLUDE_MONTHLY === '1';
              const names = all
                .filter((t) => monthly || (t.cadence ?? 'weekly') !== 'monthly')
                .map((t) => t.name);
              if (names.length === 0) { console.error('cadence filter emptied $file'); process.exit(2); }
              process.stdout.write(JSON.stringify(names));
            ")
            # No silent caps: whatever this round does NOT measure gets named.
            skipped=$(INCLUDE_MONTHLY="$INCLUDE_MONTHLY" node -e "
              const b = require('./$file');
              const monthly = process.env.INCLUDE_MONTHLY === '1';
              const names = (b.targets ?? [])
                .filter((t) => !monthly && (t.cadence ?? 'weekly') === 'monthly')
                .map((t) => t.name);
              process.stdout.write(names.join(', '));
            ")
            echo "$key=$list" >> "$GITHUB_OUTPUT"
            echo "$key: $list"
            if [ -n "$skipped" ]; then
              echo "$key SKIPPED this round (monthly cadence): $skipped"
            fi
          }
          emit projects/silver-core-sdk/mutation-ratchet.json agent
          emit projects/silver-core-maestro-sdk/mutation-ratchet.json maestro

  ratchet:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.agent) }}
    # Single-target dispatch: matrix legs cannot be pruned (matrix context is
    # unavailable in job-level if), so every REAL step carries the same gate —
    # an echo+exit-0 "skip step" gates nothing (audit H4). Empty/absent input
    # (schedule runs) means the full matrix.
    steps:
      - uses: actions/checkout@v7
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        with:
          # SPARSE: the SDK suite does not need the 2.4G archive layers
          # (same exclusions as silver-core-sdk.yml; corpus-sync tests skip
          # gracefully without the Reference snapshot).
          sparse-checkout: |
            /*
            !/Public-Info-Pool/Record/
            !/Public-Info-Pool/Reference/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        with:
          node-version: '20'
      - name: Install dependencies
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        working-directory: projects/silver-core-sdk
        run: npm ci
      - name: Resolve mutate pattern from the baseline
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        id: pattern
        working-directory: projects/silver-core-sdk
        run: |
          PATTERN=$(node -e "
            const b = require('./mutation-ratchet.json');
            const t = (b.targets ?? []).find((t) => t.name === '${{ matrix.target }}');
            if (!t) { console.error('unknown target ${{ matrix.target }} in mutation-ratchet.json'); process.exit(2); }
            console.log(t.mutate);
          ")
          # Per-target ignoreStatic: some targets (e.g. sessions) carry heavy
          # module-load static mutants that inject load-variance noise into the
          # score. Their baseline is measured WITH --ignoreStatic, so the weekly
          # round must match. Emitted as the flag string (empty when unset).
          IGNORE_STATIC=$(node -e "
            const b = require('./mutation-ratchet.json');
            const t = (b.targets ?? []).find((t) => t.name === '${{ matrix.target }}');
            console.log(t && t.ignoreStatic ? '--ignoreStatic' : '');
          ")
          echo "mutate=$PATTERN" >> "$GITHUB_OUTPUT"
          echo "ignore_static=$IGNORE_STATIC" >> "$GITHUB_OUTPUT"
      - name: Stryker round (${{ matrix.target }})
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        working-directory: projects/silver-core-sdk
        run: npx stryker run --mutate "${{ steps.pattern.outputs.mutate }}" ${{ steps.pattern.outputs.ignore_static }}
      - name: Ratchet check
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        working-directory: projects/silver-core-sdk
        run: node scripts/check-mutation-ratchet.mjs --name "${{ matrix.target }}"
      - name: Upload mutation report
        if: ${{ always() && (!github.event.inputs.target || github.event.inputs.target == matrix.target) }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.target }}
          path: projects/silver-core-sdk/reports/mutation/mutation.json
          retention-days: 30

  # Same ratchet, maestro package (silver-core-maestro-sdk, monorepo
  # phase 1). Own baseline file + own check-script copy: the two packages
  # share no code by decree (SCS-REQ orchestrator-sdk §2), and CI tooling
  # follows the same one-way discipline.
  ratchet-maestro:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.maestro) }}
    # Same per-step gate as the ratchet job above (audit H4): matrix legs
    # cannot be pruned at job level, and an echo+exit-0 step skips nothing.
    steps:
      - uses: actions/checkout@v7
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        with:
          sparse-checkout: |
            /*
            !/Public-Info-Pool/Record/
            !/Public-Info-Pool/Reference/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        with:
          node-version: '20'
      - name: Install dependencies (workspace root)
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        run: npm ci
      - name: Build agent SDK (workspace dependency of the e2e tests)
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        run: npm run build --workspace silver-core-agent-sdk
      - name: Build orchestrator SDK
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        run: npm run build --workspace silver-core-maestro-sdk
      - name: Resolve mutate pattern from the baseline
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        id: pattern
        working-directory: projects/silver-core-maestro-sdk
        run: |
          PATTERN=$(node -e "
            const b = require('./mutation-ratchet.json');
            const t = (b.targets ?? []).find((t) => t.name === '${{ matrix.target }}');
            if (!t) { console.error('unknown target ${{ matrix.target }} in mutation-ratchet.json'); process.exit(2); }
            console.log(t.mutate);
          ")
          echo "mutate=$PATTERN" >> "$GITHUB_OUTPUT"
      - name: Stryker round (${{ matrix.target }})
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        working-directory: projects/silver-core-maestro-sdk
        run: npx stryker run --mutate "${{ steps.pattern.outputs.mutate }}"
      - name: Ratchet check
        if: ${{ !github.event.inputs.target || github.event.inputs.target == matrix.target }}
        working-directory: projects/silver-core-maestro-sdk
        run: node scripts/check-mutation-ratchet.mjs --name "${{ matrix.target }}"
      - name: Upload mutation report
        if: ${{ always() && (!github.event.inputs.target || github.event.inputs.target == matrix.target) }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-maestro-${{ matrix.target }}
          path: projects/silver-core-maestro-sdk/reports/mutation/mutation.json
          retention-days: 30
