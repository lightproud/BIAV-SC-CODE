name: SDK Platform Probe (manual)

# 平台矩阵探路腿（守密人 2026-07-26 裁定「先手动探一次路」）。
#
# 补的是 testbed 的**结构性**盲区：试金石以「第二消费者」视角巡检两包公开面，视角是对的，
# 但它跑在 Linux 上——bubblewrap 沙箱后端在那里解得出来，于是「Windows 宿主上 Bash 全程
# 无沙箱」这类只在别的平台成立的事实，它结构上看不见。核实（2026-07-26）：全仓
# .github/workflows/ 此前**零个** windows runner，整个家族的绿全部只在 Linux 上取得。
#
# 本腿的收益是**发现未知问题**，不是修已知问题——沙箱只是第一个被抓到的。故：
#   - 只挂 workflow_dispatch，**不入常规 CI、不设 required check**、不排定时；
#   - 允许它红。红多少是本次要采的数据，采到之后由守密人裁是否入常。
#   - continue-on-error 刻意不加：探路要看见真实的红，吞掉就白探了。
#
# 若日后裁定入常，改法是把 os 矩阵搬进 silver-core-sdk.yml 的 unit job；本文件届时退役。

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner OS to probe'
        required: false
        type: choice
        options: ['windows-latest', 'macos-latest', 'both']
        default: 'windows-latest'

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }} probe
    strategy:
      fail-fast: false
      matrix:
        # Single line on purpose: a folded scalar keeps newlines inside the
        # more-indented continuation lines, which would land literal \n inside
        # the ${{ }} expression.
        os: ${{ inputs.os == 'both' && fromJSON('["windows-latest","macos-latest"]') || fromJSON(format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/Public-Info-Pool/Record/
            !/Public-Info-Pool/Reference/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies (workspace root)
        run: npm ci
      - name: Typecheck (agent SDK)
        run: npm run typecheck --workspace silver-core-agent-sdk
      # Output is tee'd so the FINAL step can replay the failure list into the
      # log tail. Without that, the agent suite's verdict sits mid-log above the
      # maestro run and the cleanup chatter, where `get_job_logs` (tail-only)
      # cannot reach it — three probe rounds were spent reading around it.
      # `set -o pipefail` keeps vitest's exit code instead of tee's (lesson #52).
      - name: Unit suite (agent SDK)
        shell: bash
        run: |
          set -o pipefail
          npm test --workspace silver-core-agent-sdk 2>&1 | tee "$RUNNER_TEMP/agent-suite.log"
      - name: Build + unit suite (maestro SDK)
        if: always()
        run: |
          npm run build --workspace silver-core-agent-sdk
          npm run build --workspace silver-core-maestro-sdk
          npm test --workspace silver-core-maestro-sdk
      # Shell-resolver diagnostic (added after round 1, 2026-07-26): the first
      # probe failed ~24 Bash-path tests with "No POSIX shell found", yet the
      # runner demonstrably has C:\Program Files\Git\bin\git.exe and the
      # resolver's probe list covers %ProgramFiles%\Git\bin\bash.exe. Either the
      # env var is absent/differently cased under the runner shell, or bash.exe
      # is not where git.exe is — this step tells us which, instead of leaving
      # the whole cluster classified as "probably environment".
      # Runs LAST and `if: always()`: a diagnostic buried mid-log above a
      # thousand lines of test output cannot be read from the API tail — it has to
      # sit next to the failure it explains. Non-fatal: instrumentation, not a gate.
      - name: Diagnose the Windows shell resolver
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "ProgramFiles      = $env:ProgramFiles"
          Write-Host "ProgramFiles(x86) = ${env:ProgramFiles(x86)}"
          Write-Host "ProgramW6432      = $env:ProgramW6432"
          Write-Host "LOCALAPPDATA      = $env:LOCALAPPDATA"
          foreach ($p in @(
            "$env:ProgramFiles\Git\bin\bash.exe",
            "$env:ProgramFiles\Git\usr\bin\bash.exe",
            "${env:ProgramFiles(x86)}\Git\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe"
          )) { Write-Host ("exists {0,-5} {1}" -f (Test-Path $p), $p) }
          node -e "const e=process.env; const s={...e}; console.log('spread keeps ProgramFiles:', 'ProgramFiles' in s, JSON.stringify(s.ProgramFiles ?? null));"
          node -e "import('./projects/silver-core-sdk/dist/tools/shell-resolve.js').then(m => console.log('resolvePosixShells ->', JSON.stringify(m.resolvePosixShells({...process.env})))).catch(e => console.log('resolver import failed:', e.message));"
      # Replay the agent suite's verdict LAST, so the run is diagnosable from
      # the API's tail-only log view on every platform (the shell diagnostic
      # above is Windows-only; this one is not).
      - name: Agent suite failure summary
        if: always()
        shell: bash
        run: |
          f="$RUNNER_TEMP/agent-suite.log"
          if [ ! -f "$f" ]; then echo "(no agent suite log — the step never ran)"; exit 0; fi
          # Strip ANSI first: vitest colorizes, so `FAIL` is preceded by an
          # escape sequence and a naive ^-anchored grep matches nothing —
          # which is exactly what the first version of this step reported.
          plain="$RUNNER_TEMP/agent-suite.plain.log"
          sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g' "$f" > "$plain"
          echo "===== agent suite: failed test files ====="
          grep -E '^\s*FAIL\s' "$plain" | sed -E 's/^\s+//' | sort -u || true
          echo "===== agent suite: assertion messages ====="
          grep -E '^\s*(AssertionError|Error|TypeError|SyntaxError):' "$plain" | sort -u | head -40 || true
          echo "===== agent suite: tally ====="
          grep -E 'Test Files |Tests  ' "$plain" || true
