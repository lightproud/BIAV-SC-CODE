name: Discord Cold Compress

# 月度压冷（守密人 2026-07-12 甲案裁定）：把上上个月及更早的 discord dated JSONL
# 压成 .jsonl.gz（当月 + 上月保持裸文本热层）。幂等可重入。
# T62 P2-3c 已切换（2026-07-19）：操作 **BIAV-SC-DATA** 的 discord 存量
# （discord_cold_compress 经 discord_root() 分仓桥接），提交推 data 仓。
#
# ⚠ 本工作流**只保留手动派发**（扫描修复 2026-07-28）。此前它带 cron '23 3 2 * *',
# 与 community-cold-compress.yml **同一分钟**触发，而后者跑的
# `community_cold_compress.py --scope all` 内部就调用 `discord_cold_compress.run()`
# ——同一批 discord 归档被两个作业并发压缩。两者当时还分处不同 concurrency 组，
# GitHub 因此完全不会把它们串行化。具体后果：
#   1. 压冷语义是「读裸档 → 并轨进 .gz → 删裸档」。A 删掉裸档后，早先已读入裸档的 B
#      仍会写出自己那份 .gz，最后写者胜——B 的 .gz 可能缺掉 A 并轨进去的记录；
#   2. 两个作业都 `git add -A` 并推同一个 data 仓 main，落败方 rebase 后推上去的是
#      另一份树状态。
# 受影响的是社区全量档案——CLAUDE.md §6.3 仅剩三张抢救网之一。
# 月度执行唯一入口 = community-cold-compress.yml（§5.2 明定的「总入口」）；
# 本档保留 workflow_dispatch，供只压 discord 的手动补跑。
on:
  workflow_dispatch:
    inputs:
      cutoff:
        description: '冷月上界 YYYY-MM（不含；留空 = 上月）'
        required: false
        default: ''

# 与 community-cold-compress 共用一个 concurrency 组：手动补跑与月度总入口
# 决不能同时动同一批档案（组名不同 = 不串行化，正是上面那条并发缺陷的成因）。
concurrency:
  group: community-cold-compress
  cancel-in-progress: false

permissions:
  contents: read   # 只读 code 仓脚本；写 data 仓走 PAT

env:
  BIAV_SC_DATA_ROOT: ${{ github.workspace }}/data-repo

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code repo（sparse 脚本，不取数据）
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            projects/news
            scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Clone BIAV-SC-DATA（PAT，数据根）
        env:
          DATA_TOKEN: ${{ secrets.BIAV_SC_DATA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_TOKEN:-}" ]; then
            echo "::error::secret BIAV_SC_DATA_TOKEN 未配置"; exit 1
          fi
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$DATA_TOKEN" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          git clone https://github.com/lightproud/BIAV-SC-DATA.git data-repo

      - name: Run cold compress
        run: |
          if [ -n "${{ github.event.inputs.cutoff }}" ]; then
            python3 projects/news/scripts/discord_cold_compress.py --cutoff "${{ github.event.inputs.cutoff }}"
          else
            python3 projects/news/scripts/discord_cold_compress.py
          fi

      - name: Commit and push if changed → BIAV-SC-DATA
        run: |
          set -euo pipefail
          cd data-repo
          git config user.name "Erica (BIAV-SC)"
          git config user.email "lightproud@hotmail.com"
          git add -A Record/Community/discord/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data(discord): monthly cold compress (T62 P2-3c)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            # rebase 撞冲突会在树里留下未合并文件；不 abort 就重试，后续每次 pull
            # 都只回 "Pulling is not possible because you have unmerged files"，
            # 重试全程空转（见 discord-archive.yml 同位注释与 run 31992498596）。
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in ${i}s..."
            sleep $i
          done
          echo "All push attempts failed"
          exit 1
