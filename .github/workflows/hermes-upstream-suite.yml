name: Hermes Upstream Suite (base health)

# 基底体检：上游自带 Python 套件跑 **纯快照**（未换装），答「上游这个新版自己健不健康」。
#
# 为什么单开一条异步工作流（守密人 2026-08-16 第二裁，据实测翻案）：这套约 27,464 例，
# 4 核容器实测约 **4.5 小时**。串进周更会话会让周一上午拿不到包——而周更真正必须
# 挡住的那类问题（我们的补丁与上游新版对不上）由 5 分钟的桌面端回归网负责，它在
# 组装线里已有前置 job。故基底体检改在同一 commit 上异步跑，结论晚到几十分钟即可。
#
# 判定不看退出码：银芯容器里有一批恒红的环境 / 布局伪影（四簇分诊见
# Public-Info-Pool/Resource/repo-engineering/hermes-upstream-testrun-20260804.md）。
# 判定一律走 build/verify.py 的**逐条具名台账** build/upstream-false-reds.json：
# 在册即已知假红（照样点名打印），台账外一条都算真缺陷候选 → 开 issue 叫人。
# 绝不用裸词通配排除——那会把将来的真缺陷一并吞掉。

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'projects/black-pool-agent/upstream/**'
      - 'projects/black-pool-agent/build/verify.py'
      - 'projects/black-pool-agent/build/upstream-false-reds.json'
      - '.github/workflows/hermes-upstream-suite.yml'

concurrency:
  group: hermes-upstream-suite
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  suite:
    name: Upstream suite on the pristine snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/hermes-suite
          key: hermes-suite-${{ hashFiles('projects/black-pool-agent/upstream/uv.lock') }}

      # verify.py 自己取钉版 uv（astral.sh 安装脚本被代理 403，走 GitHub Releases）、
      # 自己 uv sync 九 extra、自己设 HERMES_PYTHON —— 口径与手办同源，出入即 bug。
      - name: Run suite and triage against the false-red ledger
        id: suite
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "verify", "projects/black-pool-agent/build/verify.py")
          v = importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          work = Path(os.path.expanduser("~/.cache/hermes-suite"))
          rep = v.run_base_suite(work, jobs=4)
          Path("suite-report.json").write_text(
              json.dumps(rep, ensure_ascii=False, indent=2), encoding="utf-8")
          print(v.render(rep))
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(v.render(rep), encoding="utf-8")
          # 台账外失败即真缺陷候选 —— 这一步照实红，下一步据此开 issue
          sys.exit(0 if rep["passed"] else 1)
          PY

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-upstream-suite-log
          path: |
            suite-report.json
            ~/.cache/hermes-suite/base-suite.log
          if-no-files-found: warn

      - name: Open an issue on unknown failures
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            let unknown = [], pin = '未知'
            try {
              const rep = JSON.parse(fs.readFileSync('suite-report.json', 'utf8'))
              unknown = (rep.unknown || []).map(e => e.nodeid)
            } catch (e) { /* 报告都没产出：照样开 issue，正文说明这一点 */ }
            try {
              const md = fs.readFileSync('projects/black-pool-agent/UPSTREAM.md', 'utf8')
              pin = (md.match(/pin tag \| \*\*`([^`]+)`\*\*/) || [])[1] || pin
            } catch (e) {}
            const list = unknown.length
              ? unknown.slice(0, 40).map(n => `- \`${n}\``).join('\n')
              : '_套件未产出可解析的报告——多半跑挂在依赖同步或运行器阶段，看 artifact 日志。_'
            const body = [
              `基底体检（上游自带 Python 套件，跑纯快照）在 pin \`${pin}\` 上报出**台账外失败**。`,
              '',
              '台账外 = 不在 `projects/black-pool-agent/build/upstream-false-reds.json` 里，',
              '一律按**真缺陷候选**处理，不自动放行。',
              '',
              `### 台账外失败（${unknown.length} 条）`,
              '',
              list,
              '',
              '### 怎么处置',
              '',
              '1. 看 artifact `hermes-upstream-suite-log` 里的 `base-suite.log` 定位真因',
              '2. **确属银芯容器/CI 环境伪影** → 逐条具名补进假红台账（含所属簇 + 判词 + 出处），',
              '   **绝不**用裸词通配补——通配会把将来的真缺陷一并吞掉',
              '3. **确属上游代码缺陷** → 记 `projects/black-pool-agent/gaps.md`，并评估是否该回退 pin',
              '',
              `运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n')
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `基底体检报红：上游套件在 ${pin} 出现台账外失败`,
              body,
            })
