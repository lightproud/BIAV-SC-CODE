# Auto-deploy site + wiki + news to GitHub Pages (artifact-based deployment)
# T62（2026-07-22）：从 gh-pages 分支部署（peaceiris）迁移到 GitHub Actions artifact
# 部署（actions/deploy-pages）——~553M 构建产物不再作为 1.1G 常驻分支存在仓库里，默认
# clone 降到代码基线（73M）。美术资产仍构建期从 Release 下载（不入 git）。
# ⚠ 前置：仓库 Settings → Pages → Source 须设为 "GitHub Actions"（否则 deploy 步骤失败）。
name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'projects/site/**'
      - 'projects/wiki/docs/**'
      - 'projects/wiki/package.json'
      # 2026-07-28 扫描补齐：以下两条是本工作流**自己执行**的输入，却不在触发面上——
      #   - generate_wiki_pages.py：下面「Regenerate wiki pages」直接跑它，它的产出正是
      #     「Enhanced build verification」要验的那批 HTML；改坏它不触发部署，于是构建
      #     验证门对它永远不开，main 一路绿，站点静静停在上一次部署，直到某次无关的
      #     site 改动触发部署才炸——报错点离病因已隔了好几次提交。
      #   - package-lock.json：`npm ci` 装的是它、不是 package.json；只改锁文件的
      #     依赖升级同样绕过整条构建验证。
      - 'projects/wiki/package-lock.json'
      - 'projects/wiki/scripts/generate_wiki_pages.py'
      # generate_wiki_pages.py 在下面的「Regenerate wiki pages」里**读这一层**
      # （characters.json / character_index.json / voice_lines.json / world_lore.json /
      # cg_gallery.json / item_stories.json），部署页面正是由它现场推导出来的。
      # 只改数据层不改 docs/ 时，站点内容会变而部署不触发——线上停在旧数据。
      - 'projects/wiki/data/processed/**'
      - 'Public-Info-Pool/Resource/proposal/**'
      - 'okf/visualizer.html'
      - '.github/workflows/deploy-site.yml'
  # 每日兜底重部署（2026-07-28 扫描补齐）。
  #
  # 原始理由是 /news/ 页面的数据兜底：采集器每 3 小时重写 news.json、提交一律带
  # `[skip ci]`，push 触发不了本工作流，线上快照只能靠定时刷新。**该页面已于
  # 2026-08-21 下线删除**（守密人裁定），此条理由作废；cron 保留的现行理由是
  # wiki 构建期从 Release 拉美术资产 + 数据层推导页面，需要一条与 push 触发面
  # 无关的日更兜底（同时维持 dead-man-switch 沉默检测射程，见末条）。
  #
  # 同样理由的既有先例：build-analysis-index.yml 走 schedule-only、
  # build-okf-bundle.yml 刻意把每小时归档层排除在 paths 外并用每日 cron 兜底。
  # 取每日而非每 3 小时：本工作流要从 Release 拉美术资产 + npm ci + 构建 wiki（~20 分钟），
  # 跟采集同频重跑不划算；日更把陈旧上限从「数周」压到「一天」。
  # 副作用（正向）：带 cron 后本工作流进入 dead-man-switch.yml 的沉默检测射程。
  schedule:
    - cron: '35 8 * * *'   # 每日 08:35 UTC（北京 16:35），错开 15 点档采集群与 16:40 档
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # VitePress lastUpdated 读 git 提交时间；默认浅检出只有一个提交，
          # 每页都会被戳成本次部署的时间而非内容真实的最后修改时间。
          fetch-depth: 0

      - name: Download lightweight art assets from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # SLIM 部署（守密人 2026-06-21 裁定）：GitHub Pages 站点硬上限 1GB，
          # 全量美术/音视频解压约 8-10GB 远超限。策略：只内嵌轻量资产（icon + units），
          # GB 级重媒体（cg/portraits/uiresources/audio/video）不下载；对应画廊页由
          # generate_wiki_pages.py 自动降级为指向 unpacked-assets Release 的占位页。
          echo "Downloading lightweight assets (icon + units) from unpacked-assets..."
          cd projects/wiki/docs/public
          gh release download unpacked-assets \
            -p "morimens-icons-full.tar.gz" \
            -p "morimens-units.tar.gz"
          echo "Extracting..."
          tar xzf morimens-icons-full.tar.gz && rm morimens-icons-full.tar.gz
          tar xzf morimens-units.tar.gz && rm morimens-units.tar.gz
          echo "Asset directories (slim set):"
          for d in icon bunit munit; do
            if [ -d "$d" ]; then
              count=$(find "$d" -type f | wc -l)
              size=$(du -sh "$d" | cut -f1)
              echo "  $d: $count files ($size)"
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/wiki/package-lock.json

      - name: Install wiki dependencies
        working-directory: projects/wiki
        run: npm ci

      - name: Regenerate wiki pages with media assets
        run: python projects/wiki/scripts/generate_wiki_pages.py

      - name: Build wiki
        working-directory: projects/wiki
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p dist/wiki

          cp -r projects/site/public/. dist/
          [ -d projects/site/design ] && cp -r projects/site/design dist/design
          cp -r projects/wiki/docs/.vitepress/dist/* dist/wiki/
          mkdir -p dist/kb
          [ -f "okf/visualizer.html" ] && cp "okf/visualizer.html" dist/kb/index.html
          mkdir -p dist/docs
          [ -f "Public-Info-Pool/Resource/proposal/biav-project-plan-202603.html" ] && cp "Public-Info-Pool/Resource/proposal/biav-project-plan-202603.html" dist/docs/BIAV-SC-CODE-project.html
          [ -f "Public-Info-Pool/Resource/proposal/biav-project-plan-202603.pdf" ] && cp "Public-Info-Pool/Resource/proposal/biav-project-plan-202603.pdf" dist/docs/BIAV-SC-CODE-project.pdf
          touch dist/.nojekyll

      - name: Verify build output
        run: |
          echo "=== dist root ==="
          ls -la dist/
          echo ""
          echo "=== index.html title ==="
          grep '<title>' dist/index.html
          echo ""
          for f in dist/index.html dist/wiki/index.html dist/kb/index.html; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f" && exit 1
            fi
            echo "OK: $f ($(wc -c < "$f") bytes)"
          done
          echo "Total files: $(find dist -type f | wc -l)"

      - name: Enhanced build verification
        run: |
          # 这一步此前是一道**拦不住任何东西的门**：所有失败模式都只 echo "WARNING"
          # 而没有任何非零退出路径，于是空白/损坏的 HTML、乃至整个 dist/wiki/index.html
          # 缺失，都会「验证通过」并照常部署上线。另有两处细节使它更宽：
          #   - `for f in $(find dist ...)` 走词分割，文件名含空格即断成两截；
          #   - dist 目录本身不存在时 find 报错但循环零轮，一切照样「OK」。
          # 现在：先确认 dist 存在，再用 -print0/read -d '' 安全遍历，任何一条不合格
          # 都累计进 failures，末尾非零退出——门要能关上才算门。
          failures=0

          if [ ! -d dist ]; then
            echo "FAIL: dist/ 不存在——构建根本没产出"
            exit 1
          fi

          echo "=== Checking HTML files are not empty ==="
          html_count=0
          while IFS= read -r -d '' f; do
            html_count=$((html_count + 1))
            if ! grep -q '<html' "$f" 2>/dev/null; then
              echo "FAIL: $f 疑似空档或已损坏（无 <html>）"
              failures=$((failures + 1))
            else
              echo "OK: $f"
            fi
          done < <(find dist -name '*.html' -print0)

          if [ "$html_count" -eq 0 ]; then
            echo "FAIL: dist/ 下一个 HTML 都没有"
            failures=$((failures + 1))
          fi

          echo ""
          echo "=== Checking wiki locale directories ==="
          # zh is the root locale via VitePress rewrites (zh/:rest* → :rest*)
          if [ -f "dist/wiki/index.html" ]; then
            echo "OK: dist/wiki/ (zh root) exists ($(find dist/wiki -maxdepth 1 -name '*.html' | wc -l) html files at root)"
          else
            echo "FAIL: dist/wiki/index.html 缺失"
            failures=$((failures + 1))
          fi

          if [ "$failures" -gt 0 ]; then
            echo ""
            echo "构建验证失败 $failures 项——拒绝部署"
            exit 1
          fi
          echo ""
          echo "构建验证通过（HTML $html_count 份）"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Post-deploy smoke test
        continue-on-error: true
        run: |
          echo "Waiting 30s for GitHub Pages to propagate..."
          sleep 30
          BASE="https://lightproud.github.io/BIAV-SC-CODE"
          # wiki is zh-only (single locale at /wiki/ root); no en/ja locales configured
          for url in "$BASE/" "$BASE/wiki/" "$BASE/kb/"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if [ "$status" = "200" ]; then
              echo "OK: $url → $status"
            else
              echo "WARNING: $url → $status (may need more time to propagate)"
            fi
          done
