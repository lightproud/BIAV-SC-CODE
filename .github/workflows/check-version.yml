name: Check Morimens Version Updates

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: check-version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  check-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 50
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run version check
        id: check
        run: python projects/wiki/scripts/check_version.py

      # 自检（2026-07-28 扫描修复，照 refresh-claude-code-prompts.yml 的既有范式）：
      # 本任务把自动生成的 stub 条目写进 projects/wiki/data/processed/versions.json，
      # 再带 **[skip ci]** 直推 main——而 validate-data.yml 正是靠 push 到
      # `projects/wiki/data/**` 触发的。[skip ci] 一挂，那道 schema 门就对**机器写入的
      # 数据**永久关闭：抓错的版本串写出不合 schema 的 stub，main 照样全绿，破绽要等
      # 下一个恰好碰 data/** 的人工 PR 才现形。故落库前就地验一遍：红则不提交、不直推。
      - name: Validate wiki data before committing ([skip ci] 会跳过 validate-data.yml)
        run: |
          pip install jsonschema
          python projects/wiki/scripts/validate_data.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit version data updates
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/wiki/data/processed/versions.json
          git add projects/wiki/output/version_check_result.json
          git diff --cached --quiet || git commit -m "chore(wiki): auto-update version data and RSS feeds [skip ci]"
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            echo "Push attempt $i failed, retrying in ${i}s..."
            sleep $i
          done
          echo "All push attempts failed"
          exit 1

      - name: Create issue for new version
        if: steps.check.outputs.new_version == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.check.outputs.version }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Code-wiki] New game version detected: v${version}`,
              body: [
                `## New Version Detected`,
                ``,
                `The automated version checker has detected a new game version: **v${version}**`,
                ``,
                `### Action Items`,
                `- [ ] Verify the version number is correct`,
                `- [ ] Fill in the version title and highlights in \`versions.json\``,
                `- [ ] Update \`meta.json\` current_version if applicable`,
                `- [ ] Add detailed changelog content`,
                `- [ ] Update related wiki pages (characters, systems, etc.)`,
                ``,
                `### Auto-generated Data`,
                `A stub entry has been added to \`projects/wiki/data/db/versions.json\`.`,
                `Please review and expand with actual update details.`,
                ``,
                `---`,
                `*This issue was created automatically by the version check workflow.*`,
              ].join('\n'),
              labels: ['wiki', 'auto-detected'],
            });

      - name: Upload check result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: version-check-result
          path: projects/wiki/output/version_check_result.json
          retention-days: 30
