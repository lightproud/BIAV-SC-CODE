name: Build Capability Registry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'projects/news/scripts/**'
      # wiki 脚本层同样被 build_capability_registry.py 扫进目录（SCRIPT_DIRS 三层之一）；
      # 漏在触发器外 = 增删 wiki 脚本后目录不重建，条目与计数悄悄对不上现实
      # （2026-07-27 P3/P6 把 parse_* 与 wiki 生成器整批迁进该目录后，缺口尤其大）。
      - 'projects/wiki/scripts/**'
      - 'projects/*/CONTEXT.md'
      - '.claude/commands/**'
      - '.claude/skills/**'
      - 'memory/capability-annotations.json'
      # 2026-07-28 扫描补齐：以下三条同为 build_capability_registry.py 的**判据输入**，
      # 却不在触发面上——而本工作流**没有任何 cron 兜底**，所以漏掉即永久漂移：
      #   - .mcp.json：collect_roots() 从它认「mcp 平面」。改它（换/摘服务端）会让
      #     mcp_server.py 及其整条 import 闭包实际失去入口，目录却继续写「live (mcp)」。
      #   - .claude/settings.json：同函数认「hook 平面」（当前为空，正因如此更容易漏）。
      #   - tests/**：test_refs() 决定一个部件是 `test-only` 还是 `orphaned`。删掉某脚本
      #     的最后一个测试引用后，孤儿检测仍旧报它「有测试覆盖」——守卫对一个已无人
      #     引用的部件出具清白证明，比不检测更坏。
      # 本任务只在结果真变了才提交，多数轮次是空跑，代价可忽略。
      - '.mcp.json'
      - '.claude/settings.json'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: capability-registry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate capability directory
        run: python scripts/build_capability_registry.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/capability-registry.json memory/capability-index.md
          if git diff --staged --quiet; then
            echo "Capability directory already up to date"
          else
            git commit -m "chore: rebuild capability registry [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin main && exit 0
              # rebase 撞冲突会在树里留下未合并文件；不 abort 就重试，后续每次 pull
              # 都只回 "Pulling is not possible because you have unmerged files"，
              # 剩下几次尝试全是空转（2026-08-17 run 31992498596 实测 4 次里 3 次是这条）。
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $i failed, retrying in ${i}s..."
              sleep $i
            done
            echo "All push attempts failed"
            exit 1
          fi
