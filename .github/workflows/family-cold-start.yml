name: SDK Family Cold Start (weekly)

# 冷态自举门（守密人 2026-07-26 裁定「建，挂周检节拍」）。
#
# 抓的不是某个具体 bug，是这一**普适形态**：凡是文档里写给人照抄的命令，都该有一条 CI 腿在
# 干净环境里实跑——否则「文档说的」与「CI 跑的」是两套东西，而 CI 那套永远有前置步骤兜着。
#
# 真实案例（2026-07-26 SDK 审视会话）：maestro / testbed 按包名 import，经 workspace 软链
# 解析到 dist/，但两包都没有构建钩子。常规 CI 永远先跑 `npm run build --workspace ...` 再 test，
# 于是「npm test 自己能不能跑」这个问题在 CI 里根本不存在；新克隆直跑则 maestro 8/29、
# testbed 1/3 文件在 import 解析阶段就炸，而 vitest 汇总行仍打印「331 passed」，扫一眼像绿的。
# 两包已补 `pretest`；本工作流是防它（及同形态后来者）复发的机器岗哨。
#
# 与既有腿的分工，不重叠：
#   - silver-core-sdk.yml / silver-core-maestro-sdk.yml：常规 CI，**先 build 后 test**，
#     管的是「代码对不对」。
#   - 本工作流：**不预先 build**，只跑各包文档里那条命令，管的是「文档那条路走不走得通」。
#
# 刻意周检而非每 PR：与常规 CI 的构建步骤重复，每 PR 跑纯属拖慢；这类缺陷是低频、结构性的，
# 一周抓一次足够。故**不设为 required check**。

on:
  schedule:
    - cron: '29 6 * * 2' # 周二 06:29 UTC（14:29 北京），与周一的变异棘轮错峰
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start:
    name: Cold start from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/Public-Info-Pool/Record/
            !/Public-Info-Pool/Reference/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies (workspace root — the documented first step)
        run: npm ci
      - name: Assert no dist exists yet (the cold precondition this gate is about)
        run: |
          set -euo pipefail
          for p in silver-core-sdk silver-core-maestro-sdk; do
            if [ -d "projects/$p/dist" ]; then
              echo "projects/$p/dist exists after a bare checkout+ci — the cold" \
                   "precondition is void and this gate would prove nothing." >&2
              exit 1
            fi
          done
          echo "cold precondition holds: neither package has a dist."
      # Each package is run from ITS OWN directory with the command its CONTEXT.md
      # tells a human to type. No `npm run build` first — that is the whole point.
      #
      # Every step re-wipes BOTH dists first: an earlier package's `pretest` builds
      # what it consumes, so without the wipe only the first step would actually be
      # cold and the rest would silently test a warm tree — exactly the blind spot
      # this gate exists to close.
      #
      # `set -o pipefail` + no pipes on the test command: a pipeline's exit status
      # is the LAST command's, so `npx vitest run | tail` reports 0 even when vitest
      # exits 1 (lesson #52, discovered in the same review). Never mask it here.
      - name: agent SDK — npm test from cold
        run: |
          set -euo pipefail
          rm -rf ../silver-core-sdk/dist ../silver-core-maestro-sdk/dist
          npm test
        working-directory: projects/silver-core-sdk
      - name: maestro SDK — npm test from cold
        run: |
          set -euo pipefail
          rm -rf ../silver-core-sdk/dist ../silver-core-maestro-sdk/dist
          npm test
        working-directory: projects/silver-core-maestro-sdk
      - name: testbed — npm test from cold
        run: |
          set -euo pipefail
          rm -rf ../silver-core-sdk/dist ../silver-core-maestro-sdk/dist
          npm test
        working-directory: projects/silver-core-testbed
