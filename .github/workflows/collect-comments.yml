name: "💬 Collect Video Comments"

# 独立采集忘却前夜相关 YouTube 视频（含官方 PV）的热门评论，归档到
# Record/Community/youtube_comments/{date}.json，供会话内报告引用。
# 只用 YOUTUBE_API_KEY（Google，免费配额），不碰 Anthropic API、不花钱。
# T62 P2-3c 已切换（2026-07-19）：写 **BIAV-SC-DATA**（collect_video_comments 经
# community_root() 分仓桥接读 youtube 存档 + 写 youtube_comments），提交推 data 仓。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '归档日期标签 YYYY-MM-DD（默认=北京昨日）'
        required: false
        default: ''
  schedule:
    # 每 3 小时 :55（守密人 2026-09-07 裁定；原 '5 7 * * *' 每日北京 15:05）。
    # 其中 07:55 UTC 这一档仍落在北京 15:55，日更时代的「北京 15 点档」不算断。
    # 分位选 :55 只因它是本小时唯一没人占的档（:00 update-news、:05 discord global、
    # :15 volunteer、:30 history-backfill、:45 jp）。**别高估这个错峰**：2026-09-09 实测
    # 本仓 schedule 事件中位迟到约 85 分钟（12~174 分），分位到不了运行时。真同时跑也
    # 只是推 data 仓 main 的非快进竞争——本工作流只写 youtube_comments/，与上述几支
    # 无路径重叠，rebase 结构上不会内容冲突。
    #
    # 配额是**两个独立的桶**，别按一个池算（2026-09-09 查官方文档订正，此前本注释
    # 按旧模型写成「search 100 单位 / 共用 1 万池」，数字与结论都是错的）：
    #   ① Search Queries 桶：上限 **100 次调用/日**，只有 search.list 走这里。
    #      discover_videos 每轮固定 4 条查询 = 4 次，**与有没有新评论无关，不随增量摊薄**。
    #   ② 通用桶：10000 单位/日。commentThreads.list 1 单位/页走这里。候选视频
    #      （4×25 去重后 ≤100 个）× 追平后约 1 页 ≈ 100 单位/轮。
    # 每 3 小时 8 轮：search 32 次（桶的 32%）、通用 ~800 单位（池的 8%）——两边都宽。
    # **卡住提频的是 ① 不是 ②**：提到每小时 = 24 轮 × 4 = 96 次 search，占满桶的 96%，
    # 一次 workflow_dispatch 补采就越界；而通用桶那边 24 轮才 ~2400 单位（24%），
    # 评论抓取本身完全撑得住每小时。
    # 所以要上每小时，得先让**发现**这一步不再每轮都搜（候选集缓存进 state.json、
    # 按日或按 3 小时刷一次，其余轮复用），只改 cron 会撞 ① 的墙。
    # 另注：discover_videos 里 search 失败是 except 吞掉只打印一行 —— 桶耗尽会表现成
    # 「本轮没采到新评论」，静默。真提频前这里也该出声。
    - cron: '55 */3 * * *'

concurrency:
  group: collect-comments
  cancel-in-progress: false

permissions:
  contents: read   # 只读 code 仓脚本；写 data 仓走 PAT

env:
  BIAV_SC_DATA_ROOT: ${{ github.workspace }}/data-repo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code repo（sparse 脚本，不取数据）
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            projects/news
            scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 本脚本自身只用 urllib，但为取 dump_json_atomic 而 import news_common，
      # 后者顶层 import requests——缺此步即在 import 期 ModuleNotFoundError。
      # 装声明档而非手挑单包：依赖清单单一真相源，防 news_common 日后再引新包时复发。
      - name: Install dependencies
        run: pip install -r projects/news/requirements.txt

      - name: Clone BIAV-SC-DATA（PAT，数据根：读 youtube 存档 + 写评论）
        env:
          DATA_TOKEN: ${{ secrets.BIAV_SC_DATA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATA_TOKEN:-}" ]; then
            echo "::error::secret BIAV_SC_DATA_TOKEN 未配置"; exit 1
          fi
          # 凭据内联进 remote URL，不再依赖 credential.helper store。
          # 2026-08-18 09:48~13:07 之间起，store helper 在 push 时不再返回任何凭据
          # （fatal: could not read Username for 'https://github.com'），而 pull 因
          # DATA 仓公开、匿名可读照常成功——于是所有写 DATA 仓的作业从那一刻起全部
          # 卡在 commit/push，社区归档整整停摆 3 天而无人察觉。同窗口内本仓零代码改动，
          # 变的是 runner 环境（观测到 git 2.54.0 -> 2.55.0）。
          # URL 内联与 git 版本、helper 实现无关；secret 值由 Actions 在日志中遮蔽，
          # 且仅存在于本次运行的临时 .git/config 内。
          git clone "https://x-access-token:${DATA_TOKEN}@github.com/lightproud/BIAV-SC-DATA.git" data-repo

      - name: Collect video comments
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # 回落标签取**北京当日**（原为昨日）。--date 只在评论的 published 缺失/
          # 不可解析时才用得上（日档按发布日分，见 collect_video_comments 档首）。
          # 日更时代一轮覆盖「昨日 15:05 → 今日 15:05」，取昨日是个折中；改成 3 小时
          # 一轮后单轮窗口只有 3 小时，同一天内采到的坏时间戳条目理应记在当天。
          # workflow_dispatch 传 date 仍然照旧覆盖，补采历史不受影响。
          D="${{ github.event.inputs.date }}"
          [ -n "$D" ] || D=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          python projects/news/scripts/collect_video_comments.py --date "$D"

      - name: Commit comments archive → BIAV-SC-DATA
        run: |
          set -euo pipefail
          cd data-repo
          git config user.name "Erica (BIAV-SC)"
          git config user.email "lightproud@hotmail.com"
          git add Record/Community/youtube_comments/
          if git diff --staged --quiet; then
            echo "No new comments to commit"
            exit 0
          fi
          git commit -m "data: archive youtube video comments (T62 P2-3c)"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying in ${i}s..."
            sleep $i
          done
          echo "All push attempts failed"
          exit 1
